<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сложный пример CSS Grid</title>
<style>
 body {
 display: flex;
 align-items: center;
 justify-content: center;
 min-height: 100vh;
 margin: 0;
 font-family: Arial, sans-serif;
 background-color: #f5f5f5;
 }
 /* Контейнер сетки */
 .grid-container {
 display: grid;
 grid-template-columns: 30px 0.5fr 0.5fr 1fr 0.5fr;
 grid-template-rows: 130px 130px 260px 60px;
 row-gap: 12px;
 column-gap: 12px;
 padding: 12px;
 width: 90%;
 max-width: 1200px;
 background-color: rgb(175, 175, 175);
 }
 /* Цветные элементы сетки с именованными областями */
 .item1 { 
    display: grid;
    grid-column: 1/4;
    background-color: #A1E8AF; }
 .item2 {
    display: grid;
    grid-column: 4/ 5;
    background-color: #FFE156; }
 .item3 {
    display: grid;
    grid-row: 2;
    grid-column: 1 / 5;
    background-color: #FF9F1C; }
 .item4 {
    display: grid;
   
    grid-row: 3;
    grid-column: 1/3;
    background-color: #FFB6B9; }
 .item5 {
    display: grid;
    grid-row: 4;
    grid-column: 5;
    background-color: #4D96FF; }

 /* Оформление элементов сетки */
 .grid-item {
 display: flex;
 align-items: center;
 justify-content: center;
 color: white;
 font-size: 1.5em;
 font-weight: bold;
 border-radius: 8px;
 padding: 20px;
 }
</style>
</head>
<body>
<div class="grid-container">
 
 <div class="grid-item item1">Широкий блок</div>
 <div class="grid-item item2">Во всю ширину</div>
 <div class="grid-item item3">Нижний блок</div>
 <div class="grid-item item4">Большой блок</div>
 <div class="grid-item item5">Футер</div>
</div>
</body>
</html>
